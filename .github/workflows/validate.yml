name: validate
on:
  push:
    paths:
      - 'skills/**'
      - 'router/**'
  pull_request:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml

      - name: Validate all skills
        run: python3 scripts/validate-skills.py

      - name: Leak scan
        run: |
          ! grep -rl '/home/\|/root/\|BEGIN.*PRIVATE' skills router || \
            (echo "⚠️ possible leak detected" && exit 1)