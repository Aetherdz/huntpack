<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#10161f"/>
      <stop offset="1" stop-color="#0a2e1f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e063"/>
      <stop offset="1" stop-color="#00c853"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8bd8ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- subtle tech grid -->
  <g stroke="#1f2d3a" stroke-width="1" opacity="0.35">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200"/>
    <path d="M200 0 V360 M400 0 V360 M600 0 V360 M800 0 V360 M1000 0 V360"/>
  </g>

  <!-- target reticle (bug-bounty mark) -->
  <g transform="translate(168 158)" filter="url(#glow)">
    <circle r="92" fill="none" stroke="#00e063" stroke-width="3" opacity="0.55"/>
    <circle r="66" fill="none" stroke="#00e063" stroke-width="2" opacity="0.75"/>
    <circle r="40" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <circle r="12" fill="url(#accent)"/>
    <path d="M-118 0 H118 M0 -118 V118" stroke="#00e063" stroke-width="2" opacity="0.6"/>
    <!-- crosshair ticks -->
    <g stroke="#00e063" stroke-width="2" opacity="0.9">
      <path d="M-132 -14 h18 M-132 14 h18"/>
      <path d="M114 -14 h18 M114 14 h18"/>
      <path d="M-14 -132 v18 M14 -132 v18"/>
      <path d="M-14 114 v18 M14 114 v18"/>
    </g>
  </g>

  <!-- title + tagline -->
  <text x="330" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" fill="url(#txt)" letter-spacing="2">HuntPack</text>
  <text x="334" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="27" fill="#58a6ff" font-weight="500">Method-first bug bounty skills for AI agents</text>

  <!-- PoC-or-nothing chip -->
  <rect x="332" y="222" rx="30" width="330" height="46" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <text x="497" y="253" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#00e063" font-weight="700" text-anchor="middle" filter="url(#glow)">⚔ PoC or nothing</text>

  <!-- pipeline stage strip -->
  <g transform="translate(0 288)">
    <rect width="1200" height="72" fill="#0a0f16" opacity="0.92"/>
    <g font-family="monospace" font-size="15" font-weight="600" fill="#5eead4" text-anchor="middle">
      <text x="430" y="26" fill="#8b949e">P I P E L I N E</text>
    </g>
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">
      <text x="60"  y="44">Understand</text>
      <text x="150" y="44" fill="#30363d">→</text>
      <text x="250" y="44">Recon</text>
      <text x="340" y="44" fill="#30363d">→</text>
      <text x="440" y="44">Hunt</text>
      <text x="530" y="44" fill="#30363d">→</text>
      <text x="630" y="44">Discipline</text>
      <text x="745" y="44" fill="#30363d">→</text>
      <text x="860" y="44">Prove</text>
      <text x="955" y="44" fill="#30363d">→</text>
      <text x="1070" y="44">Deliver</text>
    </g>
  </g>
</svg>